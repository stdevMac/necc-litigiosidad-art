# Valores correctos (verificados a mano contra cada PDF). Montos en PESOS.
# null = la entidad no informa ese dato (el sistema debe abstenerse, no inventar).
# paginas: páginas donde está la información (para medir la localización).
#
# Criterios de negocio aplicados (ver config/ontologia.yaml):
#  - reserva_reclamaciones_judiciales = neta de FFEP y reaseguro (si se informan).
#  - reserva_pasivo_global = bruta (si sólo hay neta: neta + pagos parciales).
#  - juicios_abiertos = total, incluidos COVID (si viene separado: sin + con pagos).

