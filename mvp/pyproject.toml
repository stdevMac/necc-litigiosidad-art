[project]
name = "necc"
version = "0.1.0"
description = "Extracción y estandarización automática de indicadores de litigiosidad de notas contables de ART"
readme = "README.md"
authors = [
    { name = "Marcos Maceo", email = "marcosmaceowork@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "google-genai>=2.30.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
necc = "necc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Aviso de los bindings SWIG de PyMuPDF al importarse (ajeno al proyecto).
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
